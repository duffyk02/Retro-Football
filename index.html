 if(t==='pass'){o.type='triangle';o.frequency.setValueAtTime(400,n);o.frequency.exponentialRampToValueAtTime(1200,n+0.15);g.gain.setValueAtTime(0.2,n);g.gain.linearRampToValueAtTime(0,n+0.15);o.start(n);o.stop(n+0.15);}

class Entity{ constructor(x,y,color,team,number){ this.x=x;this.y=y;this.z=0;this.vx=0;this.vy=0;this.vz=0;this.radius=13;this.height=26;this.color=color;this.team=team;this.number=number||"00";this.speed=2.6;this.hasBall=false;this.isBlocked=false;this.isReferee=false;this.name=team==='home'?"USER":"COMP"; }
 update(){ this.x+=this.vx; this.y+=this.vy; if(this.z>0||this.vz>0){this.vz-=GRAVITY;this.z+=this.vz;} if(this.z<=0){this.z=0;this.vz=0;} this.x=Math.max(this.radius,Math.min(FIELD_WIDTH-this.radius,this.x)); this.y=Math.max(this.radius+SCROLL_Y_MIN,Math.min(SCROLL_Y_MAX-this.radius,this.y)); }
 draw(ox){ const sx=this.x-ox, sy=this.y-this.z, mv=Math.abs(this.vx)>0.1||Math.abs(this.vy)>0.1;
  ctx.beginPath(); ctx.ellipse(sx,this.y,this.radius,this.radius/2,0,0,Math.PI*2); ctx.fillStyle="rgba(0,30,0,0.4)"; ctx.fill();
  ctx.fillStyle=(this.team==='home')?'#fff':'#222'; const lo=mv?Math.sin(animFrame*0.3)*5:0;
  ctx.fillRect(sx-5,sy-8,3,8+lo); ctx.fillRect(sx+2,sy-8,3,8-lo);
  ctx.fillStyle=(isOnFire&&this.team==='home'&&(this.number==='12'||this.hasBall))?'#ff4500':this.color;
  ctx.fillRect(sx-7,sy-20,14,12);
  ctx.fillStyle=(this.team==='home')?'#fff':'#ffcc00'; ctx.fillRect(sx-9,sy-20,2,6); ctx.fillRect(sx+7,sy-20,2,6);
  ctx.fillStyle='#fff'; ctx.font='6px monospace'; ctx.textAlign='center'; ctx.fillText(this.number,sx,sy-11);
  ctx.fillStyle='#ffdbac'; ctx.fillRect(sx-3,sy-24,6,5);
  ctx.beginPath(); ctx.arc(sx,sy-25,7,0,Math.PI*2); ctx.fillStyle=(isOnFire&&this.team==='home')?'#ff4500':this.color; ctx.fill();
  if(this.hasBall&&gameState===STATE_PLAYING){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(sx-15,sy-38,30,4); ctx.fillStyle=ballCarrierStamina>30?'#00ff00':'#ff3333'; ctx.fillRect(sx-15,sy-38,30*(ballCarrierStamina/100),4); } } }
class Ball{ constructor(){this.x=0;this.y=0;this.z=0;this.vx=0;this.vy=0;this.vz=0;this.radius=6;this.isActive=false;}
 launch(sx,sy,sz,tx,ty,f){this.x=sx;this.y=sy;this.z=sz;this.isActive=true;this.vx=(tx-sx)/f;this.vy=(ty-sy)/f;this.vz=(GRAVITY*f)/2;}
 update(){ if(!this.isActive)return; this.x+=this.vx; this.y+=this.vy; this.vz-=GRAVITY; this.z+=this.vz; if(this.z<=0){this.z=0;this.isActive=false;} }
 draw(ox){ if(!this.isActive)return; ctx.beginPath(); ctx.arc(this.x-ox,this.y-this.z,this.radius,0,Math.PI*2); ctx.fillStyle="#8B4513"; ctx.fill(); } }

function updateAndDrawWeather() {

        weatherParticles = [];

            speed: type==='RAINY MUD'?6+Math.random()*4:2+Math.random()*2,
            drift: type==='RAINY MUD'?1.0:Math.random()*2-1.0,
            size: type==='RAINY MUD'?1.5:2+Math.random()*2 });
    }
    weatherParticles.forEach(p => {
        p.y += p.speed; p.x += p.drift;
        if (p.y > canvas.height) { p.y = 0; p.x = Math.random()*canvas.width; }
        if (p.x > canvas.width) p.x = 0; if (p.x < 0) p.x = canvas.width;

    });

// --- ADAPTIVE AI HABITS TRACKER ENGINE ---
// Indexes: [0: Bullet Cross, 1: Deep Post, 2: HB Handoff, 3: Hail Mary, 4: Screen Pass]
let playerPlayHistoryCounts = [0, 0, 0, 0, 0];
function recordPlayerPlayChoice(playIndex) {
    if (playIndex >= 0 && playIndex < playerPlayHistoryCounts.length) playerPlayHistoryCounts[playIndex]++;
}
function calculateAdaptiveDefensivePlay() {
    let weightCover = 50, weightBlitz = 50;
    const runPlays = playerPlayHistoryCounts[2];
    const deepPasses = playerPlayHistoryCounts[1] + playerPlayHistoryCounts[3];
    const shortPasses = playerPlayHistoryCounts[0] + playerPlayHistoryCounts[4];
    weightBlitz += runPlays * 15;
    weightCover += deepPasses * 18;
    weightCover += shortPasses * 6;
    weightBlitz += shortPasses * 4;
    const coverProb = weightCover / (weightCover + weightBlitz);
    if (Math.random() < coverProb) { defensivePlay = 0; setBannerMessage("AI EXPECTS PASS: DROPPING INTO COVERAGE"); }
    else { defensivePlay = 1; setBannerMessage("AI EXPECTS RUN: RUSHING THE LINE!"); }
    return defensivePlay;
}
function runAI(){ // Adaptive defender AI
 if(gameState!==STATE_PLAYING)return;
 const bc=entities.find(e=>e.hasBall);
 if(defensivePlay===1){
  // BLITZ: rush the ball carrier aggressively
  if(bc&&bc.team==='home'){ const dx=bc.x-defenderCB.x, dy=bc.y-defenderCB.y, d=Math.hypot(dx,dy)||1; defenderCB.vx=dx/d*3.4; defenderCB.vy=dy/d*3.4; }
  else { defenderCB.vx=2.5; defenderCB.vy=0; }
 } else {
  // COVERAGE: drop back, mirror the WR, react late
  const tx=receiverWR.x-60, ty=receiverWR.y;
  const dx=tx-defenderCB.x, dy=ty-defenderCB.y, d=Math.hypot(dx,dy)||1;
  if(d>30){ defenderCB.vx=dx/d*1.6; defenderCB.vy=dy/d*1.6; }
  else if(bc&&bc.team==='home'&&bc!==receiverWR){ const dx2=bc.x-defenderCB.x, dy2=bc.y-defenderCB.y, d2=Math.hypot(dx2,dy2)||1; defenderCB.vx=dx2/d2*2.0; defenderCB.vy=dy2/d2*2.0; }
  else { defenderCB.vx*=0.9; defenderCB.vy*=0.9; }
 }
}

 ctx.fillStyle='#fff'; ctx.font='bold 10px monospace'; ctx.textAlign='center'; ctx.fillText("FRANCHISE MARKET",400,60);
 ctx.fillStyle='#ffcc00'; ctx.fillText("COINS: "+salaryCapCoins,400,100);
 for(let i=0;i<marketRosterList.length;i++){ const p=marketRosterList[i]; ctx.fillStyle='#1e293b'; ctx.fillRect(50,140+i*65,700,45); ctx.strokeStyle='#fff'; ctx.strokeRect(50,140+i*65,700,45);
  ctx.fillStyle='#fff'; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText(p.name+" | +"+p.value+" "+p.stat+" | "+p.cost+" COINS",80,166+i*65);
  ctx.textAlign='center'; ctx.fillStyle=p.bought?'#475569':'#00ff00'; ctx.fillText(p.bought?"[SECURED]":"[BUY]",680,166+i*65); }
 ctx.fillStyle='#ff3333'; ctx.font='8px monospace'; ctx.fillText("TAP TO EXIT",400,380); if(tapFlag){tapFlag=false;gameState=STATE_PLAY_SELECT;} }
// Main render
function render(){
 if(gameState===STATE_PLAYBOOK_DESIGNER){drawPlaybookDesigner();return;}
 if(gameState===STATE_HALFTIME){drawHalftimeShow();return;}
 if(gameState===STATE_ROSTER_MARKET){drawFranchiseRosterStorefront();return;}
 if(gameState===STATE_LEADERBOARD){drawLeaderboardView();return;}
 if(gameState===STATE_CHAMPIONSHIP){drawChampionshipScreen();return;}
 if(gameState===STATE_TEAM_CUSTOM){drawCustomizerScreen();return;}
 if(gameState===STATE_STATS_SCREEN){drawStatsScreen();return;}
 if(gameState===STATE_PLAY_SELECT){drawMenu();return;}
 const wt=WEATHER_MODES[currentWeatherIndex];
 ctx.fillStyle=wt==='RAINY MUD'?'#5a5d3b':(wt==='BLIZZARD SNOW'?'#e2ebd5':'#2a752a'); ctx.fillRect(0,0,800,450);
 drawAnimatedCrowd(camera.x);
 ctx.save();
 if(camera.shake>0){ctx.translate((Math.random()-0.5)*camera.shake,(Math.random()-0.5)*camera.shake);camera.shake*=0.9;if(camera.shake<0.2)camera.shake=0;}
 camera.zoom+=(camera.targetZoom-camera.zoom)*0.05; ctx.scale(camera.zoom,camera.zoom); ctx.translate(-camera.x,0);
 mudTracks.forEach(m=>{ctx.fillStyle='rgba(54,38,15,0.4)';ctx.beginPath();ctx.arc(m.x,m.y,m.size,0,Math.PI*2);ctx.fill();});
 ctx.fillStyle='#a62424'; ctx.fillRect(0,SCROLL_Y_MIN,40,SCROLL_Y_MAX-SCROLL_Y_MIN);
 ctx.fillStyle='#244ca6'; ctx.fillRect(FIELD_WIDTH-40,SCROLL_Y_MIN,40,SCROLL_Y_MAX-SCROLL_Y_MIN);
 ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2;
 for(let i=80;i<FIELD_WIDTH;i+=80){ctx.beginPath();ctx.moveTo(i,SCROLL_Y_MIN);ctx.lineTo(i,SCROLL_Y_MAX);ctx.stroke();}
 ctx.strokeStyle='#3357FF'; ctx.lineWidth=3; ctx.beginPath();ctx.moveTo(lineOfScrimmage,SCROLL_Y_MIN);ctx.lineTo(lineOfScrimmage,SCROLL_Y_MAX);ctx.stroke();
 ctx.strokeStyle='#ffcc00'; ctx.beginPath();ctx.moveTo(firstDownLine,SCROLL_Y_MIN);ctx.lineTo(firstDownLine,SCROLL_Y_MAX);ctx.stroke();
 particles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life);ctx.fillRect(p.x,p.y,5,5);}); ctx.globalAlpha=1.0;
 const rq=[...entities]; if(passBall.isActive)rq.push(passBall); rq.sort((a,b)=>a.y-b.y); rq.forEach(it=>it.draw(camera.x));
 ctx.restore();
 if(playByPlayTimer>0){ playByPlayTimer--; ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(40,390,720,30); ctx.strokeStyle='#ffcc00'; ctx.lineWidth=2; ctx.strokeRect(40,390,720,30);
  ctx.fillStyle='#fff'; ctx.font='8px monospace'; ctx.textAlign='center'; ctx.fillText(playByPlayText,400,409); }
 const ry=Math.max(0,Math.ceil((firstDownLine-lineOfScrimmage)/16)), sx2=currentDown===1?'ST':currentDown===2?'ND':currentDown===3?'RD':'TH';
 scoreDiv.innerHTML=homeTeamName+":"+playerScore+" "+awayTeamName+":"+cpuScore+" | DN:"+currentDown+sx2+" & "+ry+" YDS";
}
// Input
let isTouching=false, tapFlag=false, actionButtonPressed=false;
function canvasTap(x,y){ initAudio(); tapFlag=true;
 if(gameState===STATE_TEAM_CUSTOM){
  if(x>300&&x<500&&y>360&&y<405){ // LOCK PROFILE
   playerQB.color=COLOR_OPTIONS[homeColorIndex]; receiverWR.color=COLOR_OPTIONS[homeColorIndex]; playerRB.color=COLOR_OPTIONS[homeColorIndex];
   defenderCB.color=COLOR_OPTIONS[awayColorIndex];
   playerQB.x=lineOfScrimmage-40; playerQB.y=225; playerQB.hasBall=true;
   receiverWR.x=lineOfScrimmage-10; receiverWR.y=130; playerRB.x=lineOfScrimmage-75; playerRB.y=225;
   defenderCB.x=lineOfScrimmage+80; defenderCB.y=150;
   gameState=STATE_PLAY_SELECT; setBannerMessage("PROFILE LOCKED!");
  } else if(x>30&&x<180&&y>150&&y<195){ homeColorIndex=(homeColorIndex+1)%COLOR_OPTIONS.length; }
  else if(x>210&&x<360&&y>150&&y<195){ awayColorIndex=(awayColorIndex+1)%COLOR_OPTIONS.length; }
  else if(x>390&&x<590&&y>150&&y<195){ currentWeatherIndex=(currentWeatherIndex+1)%WEATHER_MODES.length; }
  else if(x>30&&x<180&&y>60&&y<100){ activeTypingTarget='HOME'; } else if(x>210&&x<360&&y>60&&y<100){ activeTypingTarget='AWAY'; }
  else if(x>390&&x<590&&y>60&&y<100){ gameMode=gameMode==='1 PLAYER'?'2 PLAYER':'1 PLAYER'; }
  else if(x>300&&x<500&&y>415&&y<445){
    if (!netClient){
      const url = prompt("Server URL:", "ws://localhost:8080");
      if (url){ const room = prompt("Room name:", "lobby"); netClient = new FootballNetworkClient(url, room||'lobby'); }
    } else { try{netClient.socket.close();}catch(e){} netClient=null; isOnlineMode=false; setBannerMessage("OFFLINE"); }
  }
 } else if(gameState===STATE_PLAY_SELECT){
  for(let i=0;i<5;i++){ if(x>40&&x<580&&y>130+i*40&&y<162+i*40){ currentPlay=i; recordPlayerPlayChoice(currentPlay); calculateAdaptiveDefensivePlay(); gameState=STATE_PLAYING; playerQB.hasBall=true; playClock=30; setBannerMessage("PLAY: "+PLAYBOOK_NAMES[i]); return; } }
  if(x>40&&x<260&&y>350&&y<385){ gameState=STATE_PLAYBOOK_DESIGNER; }
 } else if(gameState===STATE_PLAYBOOK_DESIGNER){
  for(let i=0;i<5;i++){ if(x>40&&x<280&&y>80+i*42&&y<112+i*42){ currentPlay=i; return; } }
  if(x>300&&x<500&&y>350&&y<395){ gameState=STATE_PLAY_SELECT; setBannerMessage("PLAYBOOK SAVED!"); }
 } else if(gameState===STATE_PLAYING){
  // Tap = throw pass to WR
  if(!passBall.isActive&&playerQB.hasBall){ playerQB.hasBall=false; passBall.launch(playerQB.x,playerQB.y-10,10,receiverWR.x+60,receiverWR.y,40); playSound('pass'); gameState=STATE_BALL_IN_AIR; }
 }
}
canvas.addEventListener('pointerdown',e=>{ const r=canvas.getBoundingClientRect(); canvasTap((e.clientX-r.left)*(800/r.width),(e.clientY-r.top)*(450/r.height)); });
canvas.addEventListener('touchstart',e=>{ initAudio(); isTouching=true; e.preventDefault(); },{passive:false});
canvas.addEventListener('touchend',()=>{isTouching=false;});
document.getElementById('actionBtn').addEventListener('touchstart',e=>{e.preventDefault(); if(gameState===STATE_PLAYING){const c=entities.find(x=>x.hasBall); if(c){c.vz=4; playSound('pass');}}});
document.getElementById('turboBtn').addEventListener('touchstart',e=>{e.preventDefault(); isTurboBurstActive=!isTurboBurstActive; e.target.textContent=isTurboBurstActive?'TURBO: ON':'TURBO BURST';});
document.getElementById('spectateBtn').addEventListener('touchstart',e=>{e.preventDefault(); isSpectatorMode=!isSpectatorMode; e.target.textContent=isSpectatorMode?'SPECTATE: ON':'SPECTATE: OFF';});
document.getElementById('replayBtn').addEventListener('touchstart',e=>{e.preventDefault(); setBannerMessage("REPLAY: no frames recorded yet");});
// Collisions & scoring
function processCollisions(){
 if(gameState===STATE_BALL_IN_AIR&&passBall.isActive){
  const d=Math.hypot(receiverWR.x-passBall.x,receiverWR.y-passBall.y);
  if(d<25&&passBall.z<20){ passBall.isActive=false; receiverWR.hasBall=true; gameState=STATE_PLAYING; playSound('whistle'); setBannerMessage("CAUGHT!"); }
  else if(!passBall.isActive){ gameState=STATE_PLAYING; }
 }
 if(gameState===STATE_PLAYING){
  const bc=entities.find(e=>e.hasBall);
  if(bc){
   if(bc.x>=FIELD_WIDTH-60){ playerScore+=7; gameState=STATE_TOUCHDOWN; playSound('whistle'); speakCommentary("Touchdown!"); setTimeout(()=>{ lineOfScrimmage=160; firstDownLine=320; currentDown=1; gameState=STATE_PLAY_SELECT; },2000); return; }
   const d=Math.hypot(bc.x-defenderCB.x,bc.y-defenderCB.y);
   if(d<18&&bc.team==='home'){ bc.hasBall=false; playSound('tackle'); camera.shake=12; triggerHapticFeedback(80);
    const gx=bc.x, gained=Math.ceil((gx-playStartingX)/16);
    if(gx>=firstDownLine){ lineOfScrimmage=gx; firstDownLine=gx+160; currentDown=1; setBannerMessage("FIRST DOWN! +"+gained+" YDS"); }
    else { currentDown++; if(currentDown>4){ setBannerMessage("TURNOVER ON DOWNS"); lineOfScrimmage=160; firstDownLine=320; currentDown=1; } else { lineOfScrimmage=gx; setBannerMessage("TACKLED. +"+gained+" YDS"); } }
    playStartingX=lineOfScrimmage; gameState=STATE_TACKLED; setTimeout(()=>{ if(gameState===STATE_TACKLED)gameState=STATE_PLAY_SELECT; },1500); }
  }
 }
}
function handleInput(){
 if(gameState!==STATE_PLAYING)return;
 const bc=entities.find(e=>e.hasBall&&e.team==='home')||playerQB;
 if(isTouching){ bc.vx=3; bc.vy=0; } else { bc.vx*=0.9; bc.vy*=0.9; }
 if(isSpectatorMode&&bc.hasBall){ bc.vx=2.5; }
}
// --- ONLINE MULTIPLAYER CLIENT ---
class FootballNetworkClient {
  constructor(url, room){
    this.socket = new WebSocket(url); this.room = room || 'lobby';
    this.socket.onopen = () => { this.socket.send(JSON.stringify({type:'JOIN', room:this.room})); setBannerMessage("CONNECTING TO LOBBY..."); };
    this.socket.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type==='JOINED'){ netId=m.id; netTeam=m.team; isOnlineMode=true; setBannerMessage("ONLINE! YOU ARE "+netTeam.toUpperCase()); }
      if (m.type==='SYNC' && m.players){ netPlayers=m.players; this.applyState(); }
      if (m.type==='THROW' && m.from!==netId){ // opponent threw
        passBall.launch(playerQB.x, playerQB.y-10, 10, m.tx, m.ty, 40); playSound('pass'); gameState=STATE_BALL_IN_AIR;
      }
    };
    this.socket.onclose = () => { setBannerMessage("DISCONNECTED"); isOnlineMode=false; };
  }
  applyState(){
    for (const id in netPlayers){
      const p = netPlayers[id];
      if (id===netId) continue;
      // Opponent controls the defender
      if (p.team==='away'){ defenderCB.x=p.x; defenderCB.y=p.y; defenderCB.hasBall=!!p.hasBall; }
      else { playerQB.x=p.x; playerQB.y=p.y; }
    }
  }
  sendMove(){
    if (!this.socket || this.socket.readyState!==1) return;
    const me = netTeam==='home'?playerQB:defenderCB;
    this.socket.send(JSON.stringify({type:'MOVE', x:Math.round(me.x), y:Math.round(me.y), z:Math.round(me.z), hasBall:me.hasBall}));
  }
}
function loop(){ handleInput(); if(!isOnlineMode) runAI(); updatePhysics(); processCollisions();
  if (netClient && isOnlineMode && animFrame%3===0) netClient.sendMove();
  render(); requestAnimationFrame(loop); }
loop();
</script>
